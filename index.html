<!doctype html>
<html lang="en">
  <load
    src="/src/html/components/head.html"
    title="[Page Title: 60-70 characters max. Brand name + primary keyword]"
    description="[Page Description: 150-160 characters max. Engaging snippet for Google search results]"
    keywords="[Comma-separated keywords. E.g.: hvac design, ventilation installation, custom kitchen]"
    site-url="https://[your-client-domain.com]/"
    og-image="img/og-preview.jpg"
    theme-color="[HEX color code for mobile browsers address bar. E.g.: #0f172a]"
  />
  <body>
    <!-- the way to use vite-plugin-html-inject -->
    <load src="/src/html/layout/header.html" />
    <load src="/src/html/sections/hero.html" />

    <main>
      <!-- ways to the images -->
      <picture>
        <source
          srcset="/src/assets/img/webp/beach.webp"
          type="image/webp"
        />
        <img
          class="image"
          src="/src/assets/img/raw/beach.jpg"
          alt="beach"
          loading="lazy"
          width="550"
          height="385"
        />
      </picture>

      <load src="/src/html/components/accordion.html" />
      <load src="/src/html/components/main-slider.html" />
      <load src="/src/html/components/tabs.html" />
      <load
        class="form-test"
        src="/src/html/components/form.html"
        id="form1"
      />
    </main>
    <!-- the way to use vite-plugin-html-inject -->
    <load src="/src/html/components/modal-content1.html" />
    <load src="/src/html/components/modal-content2.html" />
    <load src="/src/html/components/modal-success.html" />
    <load src="/src/html/components/preloader.html" />
    <load src="/src/html/components/cookie-banner.html" />

    <load src="/src/html/layout/footer.html" />

    <div class="card">
      <h2 class="card__title">Card title</h2>
      <p class="card__text">
        Lorem ipsum dolor sit amet consectetur, adipisicing elit. Quisquam sequi
        ipsa ex libero dicta fugit, similique molestiae officia omnis iste?
      </p>
    </div>
    <!-- html code for lazySvgLoader with templates -->
    <div
      class="icon-wrapper"
      data-svg-receiver
      data-svg-id="vent"
    ></div>
    <div
      class="icon-wrapper"
      data-svg-receiver
      data-svg-id="vent"
    ></div>
    <div
      class="icon-wrapper"
      data-svg-receiver
      data-svg-id="vent"
    ></div>

    <!-- html code for lazySvgLoader with fetch -->

    <div
      class="icon-wrapper"
      data-svg-receiver
      data-svg-id="vent"
      data-svg-src="/src/html/inline-icons/vent.html"
    ></div>

    <script
      type="module"
      src="/src/js/main.js"
    ></script>
  </body>
</html>
