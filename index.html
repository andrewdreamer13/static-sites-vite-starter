<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content=""
    />
    <meta
      name="keywords"
      content=""
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon.png"
    />
    <title>static-sites-vite-starter</title>
    <script>
      (function () {
        const savedTheme = localStorage.getItem("theme");
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)")
          .matches
          ? "dark"
          : "light";
        const theme = savedTheme || systemTheme;
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <!-- the way to use vite-plugin-html-inject -->
    <load src="/src/html/layout/header.html" />
    <load src="/src/html/sections/hero.html" />

    <main>
      <!-- ways to the images -->
      <picture>
        <source
          srcset="/src/assets/img/webp/beach.webp"
          type="image/webp"
        />
        <img
          class="image"
          src="/src/assets/img/raw/beach.jpg"
          alt="beach"
          loading="lazy"
          width="550"
          height="385"
        />
      </picture>

      <load src="/src/html/components/accordion.html" />
      <load src="/src/html/components/main-slider.html" />
      <load src="/src/html/components/tabs.html" />
      <load
        class="form-test"
        src="/src/html/components/form.html"
        id="form1"
      />
    </main>
    <!-- the way to use vite-plugin-html-inject -->
    <load src="/src/html/components/modal-content1.html" />
    <load src="/src/html/components/modal-content2.html" />
    <load src="/src/html/components/modal-success.html" />
    <load src="/src/html/components/preloader.html" />
    <load src="/src/html/components/cookie-banner.html" />

    <load src="/src/html/layout/footer.html" />

    <div class="card">
      <h2 class="card__title">Card title</h2>
      <p class="card__text">
        Lorem ipsum dolor sit amet consectetur, adipisicing elit. Quisquam sequi
        ipsa ex libero dicta fugit, similique molestiae officia omnis iste?
      </p>
    </div>
    <!-- html code for lazySvgLoader with templates -->
    <div
      class="icon-wrapper"
      data-svg-receiver
      data-svg-id="vent"
    ></div>
    <div
      class="icon-wrapper"
      data-svg-receiver
      data-svg-id="vent"
    ></div>
    <div
      class="icon-wrapper"
      data-svg-receiver
      data-svg-id="vent"
    ></div>

   

    <!-- html code for lazySvgLoader with fetch -->

    <div
      class="icon-wrapper"
      data-svg-receiver
      data-svg-id="vent"
      data-svg-src="/src/html/inline-icons/vent.html"
    ></div>

   
    <script
      type="module"
      src="/src/js/main.js"
    ></script>
  </body>
</html>
